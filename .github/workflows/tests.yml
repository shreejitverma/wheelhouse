name: Tests
run-name: "Tests - ${{ github.event_name }} - ${{ github.ref_name }}"

# Runs the local validation documented in CONTRIBUTING.md on every change.
# Every tests/test_*.py file is executed, so a change that breaks any suite
# fails here instead of landing silently.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and run every test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install validation dependencies
        run: python -m pip install --quiet -r requirements-dev.txt ruff==0.16.10

      - name: Compile every module
        run: python -m py_compile agent_runtime/*.py agent_runtime/adapters/*.py scripts/*.py tests/*.py

      - name: Check for undefined names
        run: ruff check --select F821 agent_runtime scripts tests

      - name: Verify pinned agent protocol fixtures
        run: python scripts/agent_runtime.py verify-pins

      - name: Parse workflow, issue-template, and config YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for pattern in (".github/workflows/*.yml", ".github/ISSUE_TEMPLATE/*.yml", "wheelhouse.config.yml"):
              for path in sorted(Path(".").glob(pattern)):
                  with path.open() as fh:
                      yaml.safe_load(fh)
          PY

      - name: Run every test suite
        run: |
          set -u
          failed=()
          for suite in tests/test_*.py; do
            echo "::group::${suite}"
            if python "${suite}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=${suite}::${suite} failed"
              failed+=("${suite}")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "${#failed[@]} test suite(s) failed: ${failed[*]}"
            exit 1
          fi
          echo "All test suites passed."
